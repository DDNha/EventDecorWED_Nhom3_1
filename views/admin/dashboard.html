<!doctype html>
<html lang="vi" class="h-full bg-[#f8fafc]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventDecor - Chi tiết Gói Sự kiện</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/v/dt/dt-3.1.4/datatables.min.css"
    />

    <!-- Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <style>
      *,
      ::before,
      ::after {
        box-sizing: border-box;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .items-widget {
        flex: 1;
        min-width: 100%;
        background: #1e1b4b;
        color: white;
        border: 1px solid #e3e7f0;
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
      }
      .items-widget p {
        font-size: 15px;
        margin-bottom: 12px;
      }
      .items-widget h3 {
        font-size: 26px;
        font-weight: 700;
        margin: 0;
      }
    </style>
  </head>
  <body class="h-full m-0 p-0 bg-[#f8fafc] overflow-hidden flex">
    <!-- SIDEBAR CONTAINER -->
    <div id="sidebar-container" class="shrink-0"></div>

    <!-- CỘT NỘI DUNG CHÍNH -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      <!-- HEADER CONTAINER -->
      <div id="header-container" class="w-full shrink-0"></div>

      <!-- MAIN SCROLLABLE CONTENT -->
      <main class="flex-1 overflow-y-auto p-6 bg-[#f8fafc]">
        <!-- BREADCRUMB -->
        <nav
          class="flex items-center text-xs font-medium text-slate-400 mb-5 select-none"
          aria-label="Breadcrumb"
        >
          <ol class="inline-flex items-center space-x-1.5 md:space-x-2">
            <li class="inline-flex items-center">
              <a href="/admin" class="hover:text-blue-600 transition-colors"
                >Trang chủ</a
              >
            </li>
            <li><span class="text-slate-300 mx-1">&rsaquo;</span></li>
            <li aria-current="page">
              <span class="text-slate-600 font-semibold">Thống kê</span>
            </li>
          </ol>
        </nav>

        <!-- TIÊU ĐỀ TRANG -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-slate-800 tracking-tight">
            Tổng quan Dashboard
          </h1>
          <p class="text-[13px] text-slate-400 font-normal mt-1">
            Theo dõi các chỉ số hoạt động, doanh thu và đơn hàng toàn hệ thống
          </p>
        </div>

        <!-- KHU VỰC THỐNG KÊ & BIỂU ĐỒ (Sẽ bổ sung các widget nội dung tại đây) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="container d-flex gap-4">
            <div class="items-widget">
              <p>Tổng doanh thu</p>
              <h3>0 đ</h3>
            </div>
            <div class="items-widget">
              <p>Khách đăng ký dịch vụ</p>
              <h3>0</h3>
            </div>
            <div class="items-widget">
              <p>Đối tác hoạt động</p>
              <h3>0</h3>
            </div>
            <div class="items-widget">
              <p>Dịch vụ chờ duyệt</p>
              <h3>0</h3>
            </div>
          </div>
        </div>
        <div class="container mb-4 mt-4">
          <canvas id="myChart"></canvas>
        </div>
        <div class="container mb-4 mt-4">
          <canvas id="myChartPie"></canvas>
        </div>
        <div class="container mb-4 mt-4">
          <table id="mytable" class="display" style="width: 100%">
            <thead>
              <tr>
                <th>Tên đối tác</th>
                <th>Kỳ</th>
                <th>Số đơn</th>
                <th>Số tiền lương</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <!-- Chèn script biểu đồ (Chart.js nếu có) hoặc logic riêng cho trang Dashboard -->
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.datatables.net/v/dt/dt-3.1.4/datatables.min.js"></script>
    <script src="../../js/admin/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/admin-assets/layout-loader.js"></script>
  </body>
</html>
