
{% block title %}{% endblock %}
{% block css %}
<link rel="stylesheet" href="/css/loggin_style.css" />
{% endblock css %}

{% block content %}
<main class="container">
  <h2>Quên mật khẩu</h2>
  <p class="subtitle">Nhập email để nhận hướng dẫn đặt lại mật khẩu</p>
  <div id="errorMsg" class="error-message" role="alert"></div>
  <div id="successMsg" class="success-message" role="status"></div>
  <form id="forgotForm">
    <div class="form-group"><label for="forgotEmail">Email</label><input type="email" id="forgotEmail" autocomplete="email" placeholder="Nhập email đã đăng ký" required></div>
    <button class="btn btn-primary" type="submit">Gửi link đặt lại</button>
  </form>
  <div class="links"><a href="loggin">← Quay lại đăng nhập</a></div>
</main>
{% endblock %}
