<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu</title>
  <link rel="stylesheet" href="\css\loggin_style.css\">
</head>
<body>
<div class="container">
  <h2>Quên mật khẩu</h2>
  <p class="subtitle">Nhập email để nhận link đặt lại mật khẩu</p>

  <div id="errorMsg" class="error-message"></div>
  <div id="successMsg" class="success-message"></div>

  <form onsubmit="handleForgotPassword(event)">
    <div class="form-group">
      <label for="forgotEmail">Email</label>
      <input type="email" id="forgotEmail" placeholder="Nhập email đã đăng ký" required>
    </div>

    <button type="submit" class="btn btn-primary">Gửi link đặt lại</button>
  </form>

  <div class="links">
    <a href="login.html">← Quay lại đăng nhập</a>
  </div>
</div>

<script src="\js\auth.js\"></script>
</body>
</html>
