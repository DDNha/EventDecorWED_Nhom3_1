

{% block title %}{% endblock %}

{% block css %}
<link rel="stylesheet" href="/css/loggin_style.css" />
{% endblock css %}

{% block content %}
<div class="container">
  <h2>Đăng ký</h2>
  <p class="subtitle">Tạo tài khoản mới</p>

  <div id="errorMsg" class="error-message"></div>
  <div id="successMsg" class="success-message"></div>

  <form onsubmit="handleRegister(event)">
    <div class="form-group">
      <label for="fullName">Họ và tên</label>
      <input type="text" id="fullName" placeholder="Nhập họ tên" required>
    </div>

    <div class="form-group">
      <label for="registerEmail">Email</label>
      <input type="email" id="registerEmail" placeholder="Nhập email" required>
    </div>

    <div class="form-group">
      <label for="registerPassword">Mật khẩu</label>
      <input type="password" id="registerPassword" placeholder="Ít nhất 6 ký tự" required>
      <span class="toggle-password" onclick="togglePassword('registerPassword', this)">Hiện</span>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Xác nhận mật khẩu</label>
      <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
      <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">Hiện</span>
    </div>

    <button type="submit" class="btn btn-primary">Đăng ký</button>
  </form>

  <div class="divider"><span>hoặc</span></div>

  <div id="googleBtn" style="display: flex; justify-content: center;"></div>

  <div class="links">
    Đã có tài khoản? <a href="loggin">Đăng nhập</a>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
{% endblock %}
